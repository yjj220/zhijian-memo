name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # 테스트가 통과해야만 릴리즈를 배포한다(실패 빌드가 태그로 나가는 것을 막음).
      - name: Test
        run: dotnet test stickypad.Tests/stickypad.Tests.csproj -c Release --verbosity normal

      - name: Publish self-contained single-file exe
        shell: pwsh
        run: |
          dotnet publish stickypad/stickypad.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -o publish
          if ($LASTEXITCODE -ne 0) { throw "Publish failed" }
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md, 使用说明.md -Destination publish
          $archive = "ZhijianMemo-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -LiteralPath publish/ZhijianMemo.exe, publish/LICENSE, publish/THIRD-PARTY-NOTICES.md, publish/使用说明.md -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ZhijianMemo-*-win-x64.zip
            ZhijianMemo-*-win-x64.zip.sha256
          generate_release_notes: true
